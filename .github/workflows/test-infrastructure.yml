name: test-infrastructure

# Offline only: generator/checker plus native-tool safety tests using mocks and
# synthetic temporary files. No Matrix, model, running host, display or signing.
# The app-level logic tests require card-host's OctoScript VM and a display;
# they are a separate local run. A green workflow is not Rinx end-to-end coverage.

on:
  push:
    paths: ['oncue/tests/**', 'oncue/tools/**', 'bundle/**', '.github/workflows/**']
  pull_request:
    paths: ['oncue/tests/**', 'oncue/tools/**', 'bundle/**', '.github/workflows/**']

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline infrastructure and tool safety tests
        run: python3 -m unittest discover -s oncue/tests -p 'selftest_*.py' -v
      - name: Verify recorder guards under optimized Python
        run: python3 -O oncue/tests/selftest_native_acceptance.py
